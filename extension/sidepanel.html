           size, and that is how the trigger's caret silently moved 1.54px. A
           textarea has no element children today, so this is the same number
           either way — it is written the safer way so the pattern cannot be
           copied into a box that does have them. */
        min-height: 2em;
        max-height: 10em;
        line-height: calc(20em / 14);
        font-size: var(--text-base);
      }
      #input::placeholder { color: inherit; opacity: .5; }
      #send {
        flex: none;
        /* The same square-at-rest, square-when-enlarged shape as `.icon`, and for
           the same reason: the arrow is a character, so the box follows the
           reader's font size rather than pinning the glyph at 14px. */
        min-width: 1.75rem;
        min-height: 1.75rem;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 0.875rem;
      }
      #send:disabled { background: var(--lift); color: var(--faint); }
      /* A running turn has nothing to send and everything to stop, so the slot
         changes state instead of a second control appearing. Inverted rather
         than accented, so the two states never read as the same button. */
      #send[data-mode='stop'] { background: CanvasText; color: Canvas; font-size: 0.625rem; }
      #send[data-mode='stop']:hover { opacity: 0.85; }
      #send[data-mode='stop']:disabled { background: var(--lift); color: var(--faint); }
      /* The picker. Geometry is the original's, measured off its own stylesheet:
         224px wide, 16px panel radius, 4px padding, 40px rows with a 12px radius
         and the check on the right. Colours come from this panel's tokens
         because the sidebar has no `--dsw-*` aliases to inherit. */
      #model-menu {
        position: fixed;
        z-index: 30;
        /* The same viewport-respecting floor as `#at-menu`, and for the same
           reason: a flat minimum wins against `max-width` in a narrow panel and
           pushed the menu past the right edge. */
        min-width: min(180px, calc(100vw - 24px));
        max-width: min(280px, calc(100vw - 24px));
        max-height: min(316px, 60vh);
        overflow-y: auto;
        padding: 4px;
        border-radius: var(--radius-2xl);
        background: Canvas;
        box-shadow: var(--elevation);
      }
      .menu-label {
        padding: 6px 8px 2px;
        font-size: var(--text-xs);
        color: var(--faint);
      }
      .menu-efforts { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 6px; }
      .menu-effort {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        /* A floor, for the same reason as the rest: the effort name inside is
           font-sized. `em` resolves against this control's own 12px, so
           `calc(26 / 12)` is exactly the 26px it was. */
        min-height: calc(26em / 12);
        padding: 0 10px;
        border-radius: 999px;
        background: var(--lift);
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .menu-effort:hover { color: CanvasText; }
      /* The glyph is what survives Windows High Contrast, where the tinted pill
         below is replaced and the two levels would otherwise look identical.
         A fixed-width slot on every button, so the label does not shift sideways
         as the choice moves from one level to the other. */
      .menu-effort .check { flex: none; width: 10px; color: inherit; }
      .menu-effort[aria-checked="true"] {
        background: var(--accent-soft);
        color: CanvasText;
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent);
      }
      .menu-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 6px 8px;
        border-radius: var(--radius-xl);
        color: inherit;
        font-size: var(--text-base);
        text-align: left;
      }
      .menu-option:hover { background: var(--hover); }
      .menu-option .check { flex: none; width: 16px; color: var(--muted); }
      .menu-option .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .menu-note { padding: 8px; font-size: var(--text-xs); color: var(--faint); }
    </style>
  </head>
  <body>
    <header>
      <button id="back" class="icon" type="button" hidden></button>
      <button id="title" type="button" aria-expanded="false">
        <span id="title-text"></span>
        <span class="caret" aria-hidden="true">⌄</span>
      </button>
      <button id="find-open" class="icon" type="button"></button>
      <button id="new" class="icon" type="button"></button>
    </header>

    <!--
      Finding a word in the conversation. A long session is the normal case —
      one of the author's own is 6969 rows — and the panel showed the newest 60
      of them, so anything said earlier could only be reached by paging back
      through more than a hundred windows. This searches the whole session on the
      host, where the rows actually are.

      The count is a live region because it is the whole answer to what the
      reader asked: "3 of 12" is how they know whether to keep pressing next.
      Without it a screen reader user gets a field that appears to do nothing.
    -->
    <div id="find" hidden>
      <input id="find-input" type="text" autocomplete="off" spellcheck="false" />
      <span id="find-count" role="status"></span>
      <button id="find-prev" class="icon" type="button"></button>
      <button id="find-next" class="icon" type="button"></button>
      <button id="find-close" class="icon" type="button"></button>
    </div>

    <!--
      The main landmark is declared here rather than left implicit on
      `#transcript`. An explicit `role` on an element *overrides* its implicit
      one, so putting the list role below on `<main>` would have traded the
      "skip to content" landmark for the list structure — measured, `main`
      disappeared from the computed roles the moment `role="list"` was set on it.
      `#stage` is the content area of both views, which is what the landmark is
      for, so the landmark moves up and the list takes the element underneath.
    -->
    <div id="stage" role="main">
      <!--
        `tabindex="0"` on the conversation and on the session list, which is what
        makes the panel usable without a mouse at all.

        Before this, the scrolling region was not in the tab order, so the only
        way into the content was through the controls the rows happen to contain:
        tabbing from the composer went `#model` → `body` → `#title` → `#find-open`
        → `#new` → the *copy button of the oldest row in the window*. Measured,
        that took `scrollTop` from 4521 to 0 — the reader was thrown from the
        newest message to the oldest one to land on a button they did not ask for,
        and the rows holding no control at all (a question, a context chip, a tool
        line that succeeded) could not be reached or read.

        Keyboard scrolling is the other half: PageDown did nothing while focus sat
        on a header button, and works once focus is on the scroller itself. A
        scrollable region that cannot be focused is a region a keyboard cannot
        scroll, which is what Chrome's own accessibility audit reports.

        `tabindex="0"` rather than `-1`: the point is to be reachable by Tab. It
        does not reorder anything — the element keeps its place in the document.
      -->
      <main id="transcript" class="scroll" tabindex="0" role="list"></main>
      <!--
        Not a list itself: a `list` may own nothing but `listitem`s, and this
        element also holds the workspace headings and the settings footer. It is
        a `<section>` with a name, so the platform already gives it a `region`
        role — the landmark a reader can jump to — and each group of sessions
        below is its own list under its own heading.
      -->
      <section id="history" class="scroll" tabindex="0" hidden></section>
      <button id="earlier" type="button" hidden></button>
      <button id="to-bottom" type="button" hidden></button>
      <!--
        What the panel says when it cannot work at all. The original's status
        surface is a title, a sentence and a button, centred in the content area;
        this panel used to say the same thing in an eleven-pixel grey line below
        the content, which is where a footnote goes rather than an explanation of
        why nothing works.
      -->
      <div id="blocked" hidden>
        <p id="blocked-title"></p>
        <p id="blocked-body"></p>
        <button id="blocked-action" type="button"></button>
      </div>
    </div>

    <!--
      Every failure the panel reports is written here by `say()`, and nothing
      announced it: a screen reader user pressed send, got no reply, and had no
      way to learn why. `role="status"` is the smallest thing that fixes it —
      polite, so it waits for the reader to finish the sentence it is on, which
      is what a transient notice beside the composer should do.

      Deliberately never `hidden`. A live region has to be in the accessibility
      tree *before* the change it should announce, and `hidden` takes it out; the
      element is kept in the layout's flow and hidden by `:empty` in the
      stylesheet instead.
    -->
    <p id="toast" role="status" aria-live="polite"></p>
    <!--
      The transcript is rebuilt from scratch on every poll, so it cannot be a live
      region itself: assembling a fresh subtree would re-announce the whole
      conversation each time. This carries the two things that arrive on their own
      and stop everything until they are seen — an approval question, and the
      panel losing its host — plus the answer itself once a turn is done, which is
      the one moment its text is final.
    -->
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
    <footer>
      <div id="contexts" hidden></div>
      <div id="composer">
        <textarea id="input" rows="1"></textarea>
        <div class="composer-bar">
          <button id="model" type="button" aria-haspopup="menu" aria-expanded="false">
            <span id="model-text"></span>
            <span class="caret" aria-hidden="true">⌄</span>
          </button>
          <span class="grow"></span>
          <button id="send" type="button"></button>
        </div>
      </div>
      <!--
        Both pickers are named and typed by the code that fills them, because
        the role depends on whether there is anything to choose.

        `menuitemradio` and `option` are *owned* roles: WAI-ARIA lets them exist
        only inside a known parent, and with none the browser has no widget to
        describe. Measured before this existed, the model picker reported its
        rows as owning no role at all, so a screen reader read them as loose
        buttons and never announced the position or the selection that makes a
        list a list.

        The model trigger was already promising this. It carries
        `aria-haspopup="menu"` and opened a container with no role at all — a
        claim about the thing that appears when you press it.

        The role is not declared here because the empty state has to give it up:
        when there is no catalog the picker holds one sentence saying why, and a
        `menu` whose only child is a paragraph describes a list of choices that
        is not there. `drawModelMenu` and `drawMentionRows` therefore set the
        role alongside the rows it belongs to, so the two cannot disagree.
      -->
      <div id="model-menu" hidden></div>
      <div id="at-menu" hidden></div>
    </footer>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
