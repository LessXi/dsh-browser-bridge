<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DSH</title>
    <style>
      /*
       * Every string in this panel comes from `locales.js`, so there is no
       * literal copy here to drift out of sync with the dictionaries. The
       * static check in the test suite enforces that.
       *
       * The token names and their values are lifted from the official Codex
       * side panel's own design layer, read out of its shipped stylesheet:
       * `--spacing: .25rem` (a 4px rhythm), the 12/13/14px text steps, the 6/8/
       * 10/12/16px radius steps, the composer's ring-plus-two-shadows elevation
       * and its 16px backdrop blur, and `--leading-*`. Copying the system rather
       * than eyeballing a screenshot is why the numbers below look arbitrary
       * and are not: they are somebody else's already-debugged scale.
       *
       * What is *not* copied is their colour layer. Their semantics all route
       * through `var(--vscode-*)` because the same bundle also runs in a VS Code
       * webview, so taking those names would paint this panel with whatever host
       * theme happened to be active. `Canvas`/`CanvasText` track the browser's
       * own light and dark schemes instead, and the accent stays DSH's.
       */
      /*
       * The three text strengths are set per scheme, not once.
       *
       * Alpha compositing is linear in sRGB but WCAG contrast is not, so the
       * same `color-mix` percentage lands at a different ratio on a light
       * backdrop than on a dark one. Measured on the painted panel, 45%
       * `CanvasText` is 3.4:1 on white and 4.5:1 on near-black — the single
       * value used before this was tuned against the dark side only, and
       * quietly failed every secondary line in light mode. The overrides below
       * give each scheme the percentage its own backdrop needs, which is why
       * they are not one value.
       */
      :root {
        color-scheme: light dark;

        --spacing: 4px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-base: 14px;

        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 10px;
        --radius-xl: 12px;
        --radius-2xl: 16px;

        /* The floating pill that sits at the top of the scroll area, and the gap
           between it and the edge. Both are named because the transcript has to
           reserve exactly this much room — see the `padding-top` rule below. A
           number written twice is a number that drifts apart. */
        --pill-height: 26px;
        --pill-inset: 8px;
        --to-bottom-size: 28px;
        --to-bottom-inset: 12px;

        /* WCAG 2.2 AA needs 4.5:1 for body text, so every text token here is
           held above that against the surface it is actually painted on —
           including the tinted chips and code cards, which are not the canvas.
           The values carry headroom rather than sitting on the threshold: the
           backdrop varies (`--lift` over `Canvas` over the window), and a token
           that passes at 4.51 in one card fails in the next. */
        --line: color-mix(in oklab, CanvasText 14%, transparent);
        --line-soft: color-mix(in oklab, CanvasText 8%, transparent);
        --muted: color-mix(in oklab, CanvasText 68%, transparent);
        --faint: color-mix(in oklab, CanvasText 52%, transparent);
        /* Codex calls this `--color-codex-description`: half-strength text, used
           for labels and times. It is a colour, not a component, which is the
           whole reason their panel has no "hint" style class to copy. */
        --tertiary: color-mix(in oklab, CanvasText 56%, transparent);
        --hover: color-mix(in oklab, CanvasText 7%, transparent);
        --lift: color-mix(in oklab, CanvasText 11%, transparent);
        --accent: #4262f0;
        --accent-soft: color-mix(in oklab, var(--accent) 15%, transparent);
        /* `--accent` is calibrated as a *fill* — white text sits on it. Used as
           text colour it fails in both schemes (measured 2.82:1 on the dark
           backdrop, 3.86:1 on the light one, against the 4.5:1 body text needs).
           Same fix as the status colours below: mix toward `CanvasText` so one
           declaration darkens on light and lightens on dark. `.answer a` still
           uses the raw accent and is a separate question from this one. */
        --accent-text: color-mix(in oklab, var(--accent) 62%, CanvasText);
        /* Blending the status colours toward `CanvasText` is what keeps them
           legible in both schemes from one declaration: mixed with black on a
           light backdrop they darken, mixed with white on a dark one they
           lighten. A fixed red is too bright on white and too dim on black. */
        --ok: color-mix(in oklab, #2f9e63 78%, CanvasText);
        --bad: color-mix(in oklab, #d1453b 78%, CanvasText);
        --elevation: 0 0 0 1px #0000000a, 0 2px 8px 0 #0000000a, 0 4px 40px 8px #00000006;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --muted: color-mix(in oklab, CanvasText 74%, transparent);
          --faint: color-mix(in oklab, CanvasText 60%, transparent);
          --tertiary: color-mix(in oklab, CanvasText 64%, transparent);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: var(--text-sm)/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: Canvas;
        color: CanvasText;
        -webkit-font-smoothing: antialiased;
      }
      button, textarea { font: inherit; color: inherit; }
      button { background: transparent; border: 0; cursor: pointer; padding: 0; }
      button:focus-visible, a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      /* The editor is the one box in the panel with no radius of its own — a
         bare text box inside a 16px rounded card — so a ring drawn on it is a
         square accent rectangle inside a round one. Measured, `#input` was the
         only painted element at radius 0 while its card sat at 16, and it is the
         first thing a reader sees, because the composer takes focus as the panel
         opens. The indicator moves out to the card, where it follows the radius
         the card already has. Keyboard users still get a 2px accent ring; the
         caret still says where the text will go. */
      textarea:focus-visible { outline: none; }
      #composer:has(textarea:focus-visible) {
        box-shadow: var(--elevation), 0 0 0 2px var(--accent);
      }
      /* Under Windows High Contrast the card's ring is not drawn at all: forced
         colours discard `box-shadow`, which is the only thing that ring is made
         of, while `outline: none` above has already removed the indicator the
         browser would otherwise supply. Measured with the emulated feature, all
         seven controls lose their box-shadow, six survive on the browser's own
         outline, and the editor is the one that ends up with no visible focus at
         all — the control the panel focuses on open.
         So the editor gets an outline back, but only here. It is a real
         `outline` rather than a shadow on purpose: forced colours are what this
         block exists for, and they *keep* outlines, repainting them in the
         system's highlight colour. The square-inside-a-round-corner objection
         that moved the ring onto the card does not apply, because in this mode
         the card is not drawn as a rounded accent shape either. */
      @media (forced-colors: active) {
        textarea:focus-visible { outline: 2px solid Highlight; outline-offset: 1px; }
        /* The same mode also takes the edge off every surface that floats over
           the transcript. `--elevation` opens with `0 0 0 1px #0000000a` — a
           hairline drawn as a shadow — and this mode discards `box-shadow`
           outright while repainting every background as `Canvas`. Measured with
           the feature emulated, `#earlier`, `#to-bottom`, `#model-menu` and
           `#composer` each came out with no separator at all: no border, no
           outline, no shadow, over a backdrop of their own colour. The model
           picker was the worst of them, its rows reading as part of the
           conversation behind it.
           `#at-menu` came through that measurement on the `border` it used to
           carry alone — and the fix is this rule rather than keeping that one
           exception, because an edge that exists in one mode and not the other is
           exactly the drift being removed. Its border is gone from the ordinary
           render, where `--elevation` already draws the same line, so the mode is
           now where all five get theirs. */
        #earlier, #to-bottom, #model-menu, #at-menu, #composer {
          border: 1px solid CanvasText;
        }
      }
      [hidden] { display: none !important; }

      /* ---- header: a title and one action, and nothing else ---- */
      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
        height: 44px;
        padding: 0 6px 0 8px;
        border-bottom: 1px solid var(--line-soft);
      }
      /* The title doubles as the history affordance, which is how the session
         list stops being permanent chrome: you see it when you ask for it. */
      #title {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 6px;
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: 500;
      }
      #title:hover { background: var(--hover); }
      #title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #title .caret { flex: none; color: var(--faint); font-size: var(--text-xs); }
      .icon {
        flex: none;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: var(--radius-md);
        color: var(--muted);
        font-size: 15px;
        line-height: 1;
      }
      .icon:hover { background: var(--hover); color: CanvasText; }
      .icon:disabled { opacity: .4; }

      /* ---- the stage: one scroller visible at a time ---- */
      #stage { flex: 1; min-height: 0; position: relative; display: flex; }
      .scroll {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        /* The browser's own scroll anchoring fights a manual restore and wins
           intermittently, which is what makes a "sometimes it jumps" bug. Codex
           turns it off for the same reason and compensates by hand. */
        overflow-anchor: none;
        scrollbar-width: thin;
      }
      #transcript {
        padding: 12px 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: var(--text-base);
      }
      /* Room for the floating pill, so it covers empty air instead of the row
         that happens to be at the top. Only while the pill is actually up: an
         unconditional reserved strip would be a visible gap at the top of every
         ordinary conversation, which is a worse defect than the one being fixed.
         `margin-top`, not `padding-top`, and that is the whole fix. Padding is
         part of the scrollable content, so it scrolls away: measured per
         character, the pill covered 24 characters of a message once the reader
         scrolled up, which is the moment the pill exists for. A margin on the
         scroller shrinks the scroller's own box instead — `#stage` is a flex row
         and this element is stretched on the cross axis, so the margin is taken
         out of its height — and the strip it reserves is never part of the
         content and never moves.
         `:has()` is doing what it is good at here — the pill lives beside the
         scroller, not inside it, so there is no descendant selector that could
         express this, and the alternative is a class the renderer keeps in step
         with `hidden`. The two call sites that set that flag are the only ones
         that can change the pill's visibility. */
      #stage:has(#earlier:not([hidden])) #transcript {
        margin-top: calc(var(--pill-inset) + var(--pill-height) + 6px);
      }
      /* The same reservation for the way back down, and for the same reason: it is
         an absolutely positioned overlay drawn over the scroller, so without this
         it covers seven characters of whichever message is passing the bottom
         edge, measured per character. Bottom rather than top, so the margin is on
         the other side. */
      #stage:has(#to-bottom:not([hidden])) #transcript {
        margin-bottom: calc(var(--to-bottom-inset) + var(--to-bottom-size) + 6px);
      }
      #history { padding: 4px 6px 12px; }

      /* ---- transcript rows ---- */
      .row { display: flex; min-width: 0; }
      .row[data-kind="user"] { justify-content: flex-end; }
      .bubble {
        /* `fit-content` is what makes a short message a bubble and a long one a
           paragraph. A full-width block for a one-word reply is the single
           biggest reason a chat panel reads as a log rather than a conversation. */
        width: fit-content;
        max-width: min(456px, 100%);
        padding: 8px 12px;
        border-radius: var(--radius-2xl);
        background: var(--accent-soft);
        overflow-wrap: anywhere;
      }
      .answer { min-width: 0; overflow-wrap: anywhere; }
      #transcript :is(p, ul, ol, blockquote, pre, h1, h2, h3, h4, h5, h6) { margin: 0; }
      #transcript > * + * { margin-top: 0; }
      .answer > * + * { margin-top: 8px; }
      .answer ul, .answer ol { padding-left: 20px; }
      .answer li + li { margin-top: 2px; }
      .answer h1, .answer h2, .answer h3, .answer h4, .answer h5, .answer h6 {
        font-size: var(--text-base);
        font-weight: 600;
        margin-top: 12px;
      }
      .answer blockquote {
        border-left: 2px solid var(--line);
        padding-left: 10px;
        color: var(--muted);
      }
      .answer hr { border: 0; border-top: 1px solid var(--line-soft); }
      .answer a { color: var(--accent); }
      pre {
        background: color-mix(in oklab, CanvasText 6%, transparent);
        border-radius: var(--radius-lg);
        padding: 8px 10px;
        overflow-x: auto;
        font-size: var(--text-xs);
        line-height: 1.5;
      }
      /* Monospace needs no reduction inside a fenced block: `pre` is already at
         the smallest step, so `.92em` on top of it paints 11px — below the
         scale's own floor, and the only text in the panel that did. Inline code
         sits in 14px prose, where the reduction still lands at 12.88px and keeps
         the run of code visually distinct from the sentence around it.
         These two rules must not both match one element: `.answer code` is more
         specific than a bare `pre code`, so an override written the obvious way
         loses silently and the block stays at 11px. */
      pre code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 1em;
      }
      .answer :not(pre) > code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: .92em;
      }
      .answer code {
        background: color-mix(in oklab, CanvasText 8%, transparent);
        border-radius: var(--radius-sm);
        padding: 1px 4px;
      }
      pre code { background: none; padding: 0; }

      /* A fenced block is a card: the language and a copy button on the head
         row, the code underneath. Codex's panel ships the same shape
         (`_BlockActions`), and it is the difference between reading a snippet
         and being able to take it. */
      .code-block {
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        background: color-mix(in oklab, CanvasText 4%, transparent);
        overflow: hidden;
      }
      .code-block pre { background: none; border-radius: 0; }
      .code-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 2px 2px 10px;
        font-size: var(--text-xs);
        line-height: 1.7;
        color: var(--faint);
      }
      .code-lang {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* WCAG 2.2 AA wants 24x24 CSS px (2.5.8). The pill was 22px tall — close
         enough to look deliberate and small enough to fail, which is the kind
         of gap only a measurement catches. */
      .copy {
        flex: none;
        height: 24px;
        padding: 0 8px;
        border: 0;
        border-radius: 999px;
        background: none;
        color: var(--faint);
        font: inherit;
        font-size: var(--text-xs);
        cursor: pointer;
      }
      .copy:hover { background: var(--hover); color: CanvasText; }
      .copy[data-state='copied'] { color: var(--ok); }

      /* Copying a whole answer acts on one row, and the row is where the reader
         is looking. Hidden until the row is hovered or something in it takes
         focus, so a panel full of answers is not a panel full of buttons. */
      .answer-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 2px;
        opacity: 0;
        transition: opacity .12s ease;
      }
      .row[data-kind='assistant']:hover .answer-actions,
      .row[data-kind='assistant']:focus-within .answer-actions { opacity: 1; }
      @media (hover: none) { .answer-actions { opacity: 1; } }

      /* A wide table scrolls sideways instead of squeezing its columns into
         slivers — the call the Codex panel makes too (`_TableScroller` is
         `overflow-x: auto` with a thin scrollbar). */
      .answer .table-scroll { overflow-x: auto; scrollbar-width: thin; }
      .answer table {
        border-collapse: collapse;
        font-size: var(--text-xs);
        line-height: 1.5;
      }
      .answer th, .answer td {
        border: 1px solid var(--line-soft);
        padding: calc(var(--spacing) * 1.5) calc(var(--spacing) * 2.5);
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      .answer th {
        font-weight: 600;
        background: color-mix(in oklab, CanvasText 5%, transparent);
      }

      /* Reasoning is one line until asked. A chain of thought is not what the
         person came to the panel for, and printing it unconditionally is exactly
         the "为什么跳出来这么多莫名其妙的东西" this replaces. */
      .reasoning { display: flex; flex-direction: column; gap: 6px; }
      /* Minus the padding that makes up the 24px target, the row is 18px tall:
         a control that is easy to read and awkward to hit. The negative margin
         keeps the extra height from opening a gap in the transcript, so the
         target grows without the layout moving. */
      .reasoning-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        width: fit-content;
        min-height: 24px;
        margin: -3px 0;
        padding: 0 2px;
        color: var(--tertiary);
        font-size: var(--text-xs);
      }
      .reasoning-toggle:hover { color: var(--muted); }
      .reasoning-body {
        border-left: 2px solid var(--line-soft);
        padding-left: 10px;
        color: var(--muted);
        font-size: var(--text-xs);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 168px;
        overflow-y: auto;
      }

      /* A tool call is one line. Consecutive calls to the same tool collapse to
         one line with a count, which is how a step that ran six commands stops
         looking like six messages. */
      .tool {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        color: var(--tertiary);
        font-size: var(--text-xs);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .tool .name { color: var(--muted); flex: none; }
      .tool .args { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tool .calls { flex: none; color: var(--faint); }
      .tool .mark { flex: none; }
      .tool[data-status="error"] .mark { color: var(--bad); }
      .tool[data-status="ok"] .mark { color: var(--ok); }

      /* A failed call that has a reason behind it is a control, and it has to
         look like one: the cross alone said "something went wrong" without
         offering the explanation the tool already produced. Pointer plus a
         hover colour, because a row that opens on click and does not react to
         the pointer reads as inert text.
         The column layout is load-bearing and is the same fix the `failed` row
         needed: `.row` is a flex row, so the call and its reason are laid out
         side by side and the two overlap instead of stacking.
         Applied to every tool row rather than only the ones with a reason: with
         a single child the two directions render identically, so the
         unconditional rule cannot be wrong, and it avoids a `:has()` that has
         to stay in step with the class the renderer sets. */
      .row[data-kind="tool"] { flex-direction: column; }
      /* A clickable row is a target, and 18px is below the 24px WCAG 2.2 AA
         minimum the rest of this panel is held to — measured at 360x18 once the
         row became a control. The negative margin cancels the extra height so
         the transcript's rhythm does not move; only the hit area grows.
         The button reset matters as much as the size: this is a real `<button>`
         so it is reachable by keyboard, and a button arrives with its own
         background, border, padding and centred text — none of which a row of
         monospace text wants. */
      .tool.has-reason {
        cursor: pointer;
        min-height: 24px;
        margin: -3px 0;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        color: inherit;
      }
      .tool.has-reason:hover .args { color: var(--muted); }
      /* The reason is the tool's own diagnostic, so it keeps the monospace face
         of the row it belongs to, indented under the same left rule the
         reasoning body uses — the two are the same kind of thing: text the
         panel was told, quoted rather than spoken. */
      .tool-failure {
        border-left: 2px solid var(--line-soft);
        margin-top: 2px;
        padding-left: 10px;
        color: var(--muted);
        font-size: var(--text-xs);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 168px;
        overflow-y: auto;
      }

      .notice { color: var(--tertiary); font-size: var(--text-xs); }

      /* A turn that died leaves this behind. It is deliberately not a bubble and
         not an alert: it is one line of the transcript, coloured like an error
         so it is found when scanning, and quiet enough that a conversation
         which recovered does not look broken.
         The column layout is load-bearing: `.row` is a flex row, so without it
         the sentence and its detail sit side by side and the sentence is crushed
         into a one-character-wide sliver. */
      .row[data-kind="failed"] { flex-direction: column; }
      .failure {
        color: var(--bad);
        font-size: var(--text-xs);
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      /* The provider's own wording, one step down from the sentence above it.
         Muted rather than red, because it is no longer the message — it is the
         thing someone copies into a search when the sentence is too general. */
      .failure-detail {
        margin-top: 2px;
        color: var(--faint);
        font-size: var(--text-xs);
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      /* The `@` picker. It sits above the composer, where the eye already is
         after typing, and it is the only list in the panel — the history view
         is a whole view, and a second floating list would compete with it. */
      #at-menu {
        position: fixed;
        z-index: 30;
        /* Both bounds have to respect the viewport. A flat `min-width: 200px`
           beats `max-width` when the two conflict — CSS resolves that clash in
           favour of the minimum — so in a panel narrower than 224px the menu
           was pinned at 200px wide and hung off the right edge (measured: right
           edge at 208px in a 200px panel). `min()` keeps the floor, but lets it
           yield when the window itself is the smaller constraint. */
        min-width: min(200px, calc(100vw - 24px));
        max-width: min(320px, calc(100vw - 24px));
        max-height: min(280px, 50vh);
        overflow-y: auto;
        padding: 4px;
        /* No `border`: `--elevation` opens with `0 0 0 1px`, which *is* this
           menu's edge, so a border here drew the same line twice — measured, the
           only floating surface in the panel doing that. It is also why this menu
           was the one that came through Windows High Contrast untouched, and
           giving that up is the point: the mode now hands every floating surface
           a real border, so none of them depends on which decoration happened to
           be stacked on top of it.
           The radius matches `#model-menu`, `#composer` and `.bubble` — the
           panel's floating cards are 16px, and this was the one at 12. Its rows
           move with it, because an inner radius is the outer one less the 4px of
           padding. */
        border-radius: var(--radius-2xl);
        background: Canvas;
        box-shadow: var(--elevation);
      }
      #at-menu[hidden] { display: none; }
      .at-label {
        margin: 0;
        padding: 4px 8px 2px;
        font-size: var(--text-xs);
        color: var(--faint);
      }
      .at-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 34px;
        padding: 5px 8px;
        /* The container's radius less its 4px of padding, which is what
           `.menu-option` in the model picker already uses. Two lists of the same
           kind had 8px and 12px here, so the highlight on a row curved
           differently depending on which picker you had open. */
        border-radius: var(--radius-xl);
        text-align: left;
      }
      .at-option:hover,
      .at-option[aria-selected='true'] { background: var(--hover); }
      .at-option .site {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        object-fit: contain;
      }
      /* One line for the title and one for the URL, because a side panel cannot
         fit the official panel's `{title} {url}` on a single row. The URL is
         drawn only when two candidates would otherwise read the same. */
      .at-option .text { min-width: 0; display: flex; flex-direction: column; }
      .at-option .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-sm); }
      .at-option .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); color: var(--faint); }
      .at-empty { margin: 0; padding: 8px; font-size: var(--text-xs); color: var(--faint); }

      /* The one place in the panel that asks a question instead of reporting
         one. A pending approval is the turn's actual state, so the card reads
         as part of the transcript rather than as a modal: it sits in the flow,
         at the end, where the eye already is. */
      .approval {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: var(--lift);
      }
      .approval-head {
        font-size: var(--text-xs);
        color: var(--tertiary);
      }
      .approval-what {
        font-size: var(--text-sm);
        overflow-wrap: anywhere;
      }
      /* The consequence, stated once, and only when it is more than a read. */
      .approval-note {
        margin-top: 2px;
        font-size: var(--text-xs);
        color: var(--muted);
      }
      /* The host's own wording, kept reachable and kept out of the way: the same
         treatment a failure's detail line gets, for the same reason. */
      .approval-detail {
        font-size: var(--text-xs);
        line-height: 1.4;
        color: var(--faint);
        overflow-wrap: anywhere;
      }
      /* `wrap` because the three labels are the longest strings in the panel and
         a narrow side panel is a normal way to run this: wrapping costs a row,
         overflowing costs the third answer. */
      .approval-actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .approval-actions button {
        height: 28px;
        /* 10px rather than 12px: 「只允许一次」/「本会话允许」/「拒绝」 are the
           longest control labels in the panel, and the three of them plus gaps
           have to clear the narrowest side panel worth supporting. */
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: Canvas;
        color: inherit;
        font: inherit;
        font-size: var(--text-xs);
        cursor: pointer;
      }
      .approval-actions button:hover:not(:disabled) { background: var(--hover); }
      .approval-actions button:disabled { color: var(--faint); cursor: default; }
      /* Three answers, three buttons of equal weight. None of them is the
         primary action: this is a security decision, so the card lays the
         options out and the reader chooses — it does not choose for them by
         making one option louder. Chrome's UX team arrived at the same place
         for one-time permissions and shipped a flat, unemphasised three-button
         layout, because a weighted one "provides safer results"; weighting one
         side of a consent screen is a documented dark pattern. It is also the
         button half of the rule the labels already follow: a button says what
         happens, and no more. Painting 「本会话允许」 solid accent made the
         widest grant the default-looking one, which is exactly the nudge this
         card exists to avoid. */

      /* Waiting feedback: the text itself sweeps, the way the original does,
         but as one gradient-clipped element instead of two stacked copies with
         `!important` colour overrides. */
      .working {        font-size: var(--text-xs);
        background: linear-gradient(90deg, var(--tertiary) 0%, CanvasText 45% 55%, var(--tertiary) 100%);
        background-size: 220% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        animation: sweep 1.2s linear infinite;
        width: fit-content;
      }
      @keyframes sweep {
        from { background-position: 150% 0; }
        to { background-position: -50% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .working { animation: none; color: var(--tertiary); background: none; -webkit-background-clip: initial; }
      }

      /* ---- what the panel says when it cannot work at all ---- */
      /* The original's status surface is a title, a sentence and a button,
         centred in the content area. This panel used to say the same thing in an
         eleven-pixel grey line below the content — which is where a footnote
         goes, not an explanation of why nothing works. */
      #blocked {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px 28px 64px;
        text-align: center;
        background: Canvas;
      }
      #blocked-title { margin: 0; font-size: var(--text-base); font-weight: 600; }
      #blocked-body {
        margin: 0;
        max-width: 30ch;
        font-size: var(--text-xs);
        line-height: 1.5;
        color: var(--muted);
      }
      #blocked-action {
        margin-top: 6px;
        height: 32px;
        padding: 0 16px;
        border-radius: var(--radius-xl);
        background: CanvasText;
        color: Canvas;
        font-size: var(--text-sm);
        font-weight: 500;
      }
      #blocked-action:hover { opacity: .88; }

      /* Live model output. Deliberately plain text and not markdown: a
         half-finished table or code fence parses into something different on
         every frame, and the committed row replaces this the instant the
         attempt settles. */
      .live { display: flex; flex-direction: column; gap: 6px; }
      .live-body { white-space: pre-wrap; overflow-wrap: anywhere; }
      .live-body::after {
        content: '';
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 2px;
        vertical-align: -0.15em;
        background: var(--accent);
        animation: caret 1s steps(2, start) infinite;
      }
      .live[data-done='true'] .live-body::after { display: none; }
      /* A caret on an empty line is a cursor with nothing to point at — during
         the reasoning phase the body has no text yet, and the blinking bar was
         the only thing there. */
      .live-body:empty::after { display: none; }
      /* Reasoning while it is the only thing on screen. It is one line — a label
         and the text running after it — rather than a label above a paragraph:
         the official panel renders `Thinking` and its preview on the same line,
         and a two-line version pushes the answer down for something the reader
         is about to stop needing. The text is clamped so a long monologue cannot
         take the whole panel before the answer exists. */
      .live-think {
        display: block;
        color: var(--faint);
        font-size: var(--text-xs);
        line-height: 1.5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .live-think-label { color: var(--tertiary); }
      .live-think-text { margin-left: 6px; }
      @keyframes caret {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .live-body::after { animation: none; }
      }

      /* ---- the way back down ---- */
      #to-bottom {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: var(--to-bottom-inset);
        width: var(--to-bottom-size);
        height: var(--to-bottom-size);
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: Canvas;
        box-shadow: var(--elevation);
        color: var(--muted);
        z-index: 2;
      }
      #to-bottom:hover { color: CanvasText; }

      /* ---- the way back up, into the part of the conversation not loaded ---- */
      /* A pill at the top of the scroll area rather than a row inside it: a row
         scrolls away exactly when it is needed, and the reader who has just
         scrolled up is looking at the top of the viewport.
         It used to be a floating pill *over* the first row, which measured as a
         2617px² occlusion of the first message — and because that row is only
         drawn when the scroll area does not overflow, there was no scrolling
         that could bring the covered line back. The transcript now reserves the
         pill's height instead (rule below), so the pill floats over empty air. */
      #earlier {
        position: absolute;
        left: 50%;
        top: var(--pill-inset);
        transform: translateX(-50%);
        height: var(--pill-height);
        padding: 0 12px;
        border-radius: 999px;
        background: Canvas;
        box-shadow: var(--elevation);
        color: var(--muted);
        font-size: var(--text-xs);
        z-index: 2;
      }
      #earlier:hover:not(:disabled) { color: CanvasText; }
      #earlier:disabled { color: var(--faint); cursor: default; }

      /* ---- history ---- */
      .group-label {
        padding: 10px 10px 2px;
        font-size: var(--text-xs);
        color: var(--faint);
      }
      .session {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 7px 10px;
        border-radius: var(--radius-md);
        text-align: left;
        font-size: var(--text-sm);
      }
      .session:hover { background: var(--hover); }
      .session[aria-current="true"] { background: var(--accent-soft); }
      .session-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .session-time { flex: none; font-size: var(--text-xs); color: var(--faint); }
      .session-dot { flex: none; width: 6px; height: 6px; border-radius: 999px; background: var(--ok); }
      .session-foot { padding: 6px; margin-top: 6px; border-top: 1px solid var(--line-soft); }
      .section-label {
        margin: 0;
        padding: 10px 10px 2px;
        font-size: var(--text-xs);
        color: var(--faint);
      }
      .tab-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .tab-row .tab-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row-button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 7px 10px;
        border-radius: var(--radius-md);
        text-align: left;
        font-size: var(--text-sm);
        color: var(--muted);
      }
      .row-button:hover { background: var(--hover); color: CanvasText; }

      /* ---- the composer ---- */
      #toast {
        flex: none;
        margin: 0;
        font-size: var(--text-xs);
        color: var(--bad);
        overflow-wrap: anywhere;
      }
      /* Kept out of the layout by `:empty` rather than by the `hidden` attribute.
         `hidden` takes the element out of the accessibility tree, and a live
         region that is not in the tree when its text lands has nothing for a
         screen reader to have observed a change in — the twenty-odd failures the
         panel reports through here were announced unreliably or not at all. An
         empty element has no height, so dropping the padding is all it takes to
         keep this invisible while leaving it observable. */
      #toast:not(:empty) { padding: 0 12px 4px; }
      /* Available to a screen reader, invisible on screen, and never
         `display:none` — a live region outside the accessibility tree announces
         nothing. Clipped to a single pixel rather than removed, which is the
         only way to keep it observable while it stays out of the layout. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* The unreachable-host state lives in #blocked, above. It used to be one
         quiet line here, which put the explanation of why nothing works in the
         smallest type on screen while the content area stayed empty. */
      footer { flex: none; padding: 0 10px 10px; }
      #contexts { display: flex; flex-wrap: wrap; gap: 5px; padding-bottom: 7px; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        max-width: 100%;
        padding: 2px 4px 2px 8px;
        border-radius: 999px;
        background: var(--lift);
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .chip .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* Says "highlighted text" where 「选中内容 ·」 used to, in one glyph. The
         opening quote is the mark a quotation gets, so it reads as punctuation
         rather than as a new piece of chrome. */
      .chip .mark { flex: none; color: var(--tertiary); font-family: Georgia, serif; line-height: 1; }
      /* The site's own icon, in place of the words 「当前标签页 ·」. 14px because
         the chip's text is 12px: at 16px (the official panel's icon slot) the
         mark is taller than the line it sits on and the pill grows a bump. */
      .chip .site {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        object-fit: contain;
      }
      /* The chip's own controls had no height of their own, so they collapsed to
         the text line — 19x18 for a dismiss button. A minimum box gives them the
         same 24px target as every other control without changing the pill. */
      .chip button {
        display: grid;
        place-items: center;
        min-width: 24px;
        min-height: 24px;
        margin: -3px 0;
        padding: 0 5px;
        color: var(--faint);
        border-radius: 999px;
      }
      .chip button:hover { color: CanvasText; }
      /* The offline chip carries the way out of its own state, so it is the one
         chip that is a control rather than a fact. Coloured like the accent so
         it reads as the action, and it inherits the 24px target above. */
      .chip[data-warn="true"] { color: CanvasText; }
      .chip[data-warn="true"] .label { color: var(--faint); }
      .chip[data-warn="true"] button { color: var(--accent-text); font-weight: 600; }
      /* The selection chip is the one line in the panel that answers "will my
         highlight be sent?", so it is styled as an active decision rather than
         as another standing fact — and it disappears when the highlight does. */
      .chip[data-attached="true"] {
        background: var(--accent-soft);
        color: CanvasText;
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent);
      }
      /* The tab chip while the extension is not attached to the harness: the
         attachment cannot be made, and saying so on the chip is where it
         actually matters. */
      .chip[data-warn="true"] { color: var(--bad); }
      /* Two rows, like the original: the editor on top, a control bar under it.
         The bar is where the model picker belongs — it is a property of how the
         next message is sent, not of the conversation being read. */
      #composer {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 8px 8px 8px 12px;
        border-radius: var(--radius-2xl);
        background: color-mix(in oklab, Canvas 90%, transparent);
        box-shadow: var(--elevation);
        backdrop-filter: blur(16px);
      }
      .composer-bar { display: flex; align-items: center; gap: 6px; }
      .grow { flex: 1; }
      /* The trigger names itself once through `aria-label` and then shows only
         its value. The original's `_ComposerDropdownLabelCategory` ships
         `display:none`, so "model" is a caption it never renders either. */
      #model {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        /* A flex item's `min-width` defaults to `auto`, which is its min-content
           size — and that refused to shrink, so in a narrow panel the model name
           kept its full width and pushed the send button out of the viewport
           entirely (measured: send's right edge at 233px in a 200px panel). The
           button that sends the message is the last thing that may leave the
           screen. `#model-text` below already ellipsises, so yielding here
           degrades to an abbreviated model name, which is the right trade. */
        min-width: 0;
        max-width: 224px;
        height: 28px;
        padding: 0 6px 0 8px;
        border-radius: 999px;
        color: var(--muted);
        font-size: var(--text-sm);
        font-weight: 500;
        line-height: 20px;
      }
      #model:hover:not(:disabled) { background: var(--hover); }
      #model:disabled { color: var(--faint); cursor: default; }
      #model-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #model .caret { flex: none; color: var(--faint); font-size: var(--text-xs); transition: transform .12s; }
      #model[aria-expanded="true"] .caret { transform: rotate(180deg); }
      #input {
        flex: none;
        min-width: 0;
        resize: none;
        border: 0;
        background: transparent;
        /* The card's own padding is 12px on the left, and the toolbar's first
           control adds its own 8px, so the model name has always started at 30.
           The editor started at the card's edge, 22 — the two lines of a
           two-row composer disagreed about where "left" is by 8px, which is
           measurable and looks like a mistake because it is one. The editor's
           text is inset to the same line the toolbar's text uses. */
        padding: 4px 0 4px 8px;
        min-height: 28px;
        max-height: 140px;
        line-height: 20px;
        font-size: var(--text-base);
      }
      #input::placeholder { color: inherit; opacity: .5; }
      #send {
        flex: none;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
      }
      #send:disabled { background: var(--lift); color: var(--faint); }
      /* A running turn has nothing to send and everything to stop, so the slot
         changes state instead of a second control appearing. Inverted rather
         than accented, so the two states never read as the same button. */
      #send[data-mode='stop'] { background: CanvasText; color: Canvas; font-size: 10px; }
      #send[data-mode='stop']:hover { opacity: 0.85; }
      #send[data-mode='stop']:disabled { background: var(--lift); color: var(--faint); }
      /* The picker. Geometry is the original's, measured off its own stylesheet:
         224px wide, 16px panel radius, 4px padding, 40px rows with a 12px radius
         and the check on the right. Colours come from this panel's tokens
         because the sidebar has no `--dsw-*` aliases to inherit. */
      #model-menu {
        position: fixed;
        z-index: 30;
        /* The same viewport-respecting floor as `#at-menu`, and for the same
           reason: a flat minimum wins against `max-width` in a narrow panel and
           pushed the menu past the right edge. */
        min-width: min(180px, calc(100vw - 24px));
        max-width: min(280px, calc(100vw - 24px));
        max-height: min(316px, 60vh);
        overflow-y: auto;
        padding: 4px;
        border-radius: var(--radius-2xl);
        background: Canvas;
        box-shadow: var(--elevation);
      }
      .menu-label {
        padding: 6px 8px 2px;
        font-size: var(--text-xs);
        color: var(--faint);
      }
      .menu-efforts { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 6px; }
      .menu-effort {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--lift);
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .menu-effort:hover { color: CanvasText; }
      /* The glyph is what survives Windows High Contrast, where the tinted pill
         below is replaced and the two levels would otherwise look identical.
         A fixed-width slot on every button, so the label does not shift sideways
         as the choice moves from one level to the other. */
      .menu-effort .check { flex: none; width: 10px; color: inherit; }
      .menu-effort[aria-checked="true"] {
        background: var(--accent-soft);
        color: CanvasText;
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent);
      }
      .menu-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 6px 8px;
        border-radius: var(--radius-xl);
        color: inherit;
        font-size: var(--text-base);
        text-align: left;
      }
      .menu-option:hover { background: var(--hover); }
      .menu-option .check { flex: none; width: 16px; color: var(--muted); }
      .menu-option .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .menu-note { padding: 8px; font-size: var(--text-xs); color: var(--faint); }
    </style>
  </head>
  <body>
    <header>
      <button id="back" class="icon" type="button" hidden></button>
      <button id="title" type="button" aria-expanded="false">
        <span id="title-text"></span>
        <span class="caret" aria-hidden="true">⌄</span>
      </button>
      <button id="new" class="icon" type="button"></button>
    </header>

    <div id="stage">
      <main id="transcript" class="scroll"></main>
      <section id="history" class="scroll" hidden></section>
      <button id="earlier" type="button" hidden></button>
      <button id="to-bottom" type="button" hidden></button>
      <!--
        What the panel says when it cannot work at all. The original's status
        surface is a title, a sentence and a button, centred in the content area;
        this panel used to say the same thing in an eleven-pixel grey line below
        the content, which is where a footnote goes rather than an explanation of
        why nothing works.
      -->
      <div id="blocked" hidden>
        <p id="blocked-title"></p>
        <p id="blocked-body"></p>
        <button id="blocked-action" type="button"></button>
      </div>
    </div>

    <!--
      Every failure the panel reports is written here by `say()`, and nothing
      announced it: a screen reader user pressed send, got no reply, and had no
      way to learn why. `role="status"` is the smallest thing that fixes it —
      polite, so it waits for the reader to finish the sentence it is on, which
      is what a transient notice beside the composer should do.

      Deliberately never `hidden`. A live region has to be in the accessibility
      tree *before* the change it should announce, and `hidden` takes it out; the
      element is kept in the layout's flow and hidden by `:empty` in the
      stylesheet instead.
    -->
    <p id="toast" role="status" aria-live="polite"></p>
    <!--
      The transcript is rebuilt from scratch on every poll, so it cannot be a live
      region itself: assembling a fresh subtree would re-announce the whole
      conversation each time. This carries the two things that arrive on their own
      and stop everything until they are seen — an approval question, and the
      panel losing its host — plus the answer itself once a turn is done, which is
      the one moment its text is final.
    -->
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
    <footer>
      <div id="contexts" hidden></div>
      <div id="composer">
        <textarea id="input" rows="1"></textarea>
        <div class="composer-bar">
          <button id="model" type="button" aria-haspopup="menu" aria-expanded="false">
            <span id="model-text"></span>
            <span class="caret" aria-hidden="true">⌄</span>
          </button>
          <span class="grow"></span>
          <button id="send" type="button"></button>
        </div>
      </div>
      <div id="model-menu" hidden></div>
  <div id="at-menu" hidden></div>
    </footer>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
