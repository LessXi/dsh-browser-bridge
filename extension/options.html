<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>DSH Browser Bridge — Options</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: color-mix(in srgb, currentColor 18%, transparent);
        --muted: color-mix(in srgb, currentColor 62%, transparent);
        /* The panel's accent, not a second one. White on the old `#4d6bfe`
           measured about 4.1:1, under the 4.5:1 that body text needs, and two
           different blues for the same primary action across two surfaces of
           one product is a difference the eye reads as a mistake. */
        --accent: #4262f0;
      }
      body {
        margin: 0 auto;
        padding: 28px 24px 48px;
        max-width: 640px;
        font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 19px; margin: 0 0 4px; }
      p.lede { margin: 0 0 24px; color: var(--muted); }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin: 0 0 20px;
      }
      legend { padding: 0 6px; font-weight: 600; }
      label { display: block; margin: 0 0 6px; font-weight: 600; }
      /* The checkbox row is a label wrapping its own input, so the whole row is
         the target a finger has to hit. At the inherited 22px line box that was
         under the 24px WCAG 2.2 AA minimum (2.5.8); the padding brings it to 28
         without moving the text. */
      label.check { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
      input[type="text"], input[type="password"], input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        background: transparent;
        color: inherit;
      }
      .row { margin-bottom: 16px; }
      .hint { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
      /* The token is the one field a person pastes blind — sixty-four hex
         characters copied from another window — so it gets a reveal control and
         an inline shape check. The button sits on the input's own line, where
         the eye already is when the paste lands. */
      .token-row { display: flex; gap: 8px; align-items: stretch; }
      .token-row input { flex: 1; min-width: 0; }
      .token-row button { flex: none; padding: 8px 12px; font-size: 13px; }
      #shape { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
      /* Only shown once the field has something in it and the length is wrong:
         a warning that is always visible is one nobody reads. */
      #shape[data-state="bad"] { color: #d1453b; }
      #shape[data-state="good"] { color: #2f9e63; }
      .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      button {
        padding: 8px 14px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      #result {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 7px;
        border: 1px solid var(--line);
        white-space: pre-wrap;
        font: 12.5px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      #result[data-state="ok"] { border-color: #2f9e63; }
      #result[data-state="bad"] { border-color: #d1453b; }
      ol { margin: 8px 0 0; padding-left: 20px; }
      li { margin-bottom: 5px; }
      .warn {
        border-left: 3px solid #d9971f;
        padding-left: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <!--
      Every visible string arrives from `locales.js` at load, located by
      `data-i18n`. The page is the gate someone has to pass to paste the token
      at all, so leaving it in one language while the panel speaks another was
      the largest remaining hole in the localization.
    -->
    <h1 data-i18n="heading"></h1>
    <p class="lede" data-i18n="lede"></p>

    <fieldset class="warn">
      <legend data-i18n="warnTitle"></legend>
      <p style="margin:0" data-i18n="warnBody"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="connTitle"></legend>
      <div class="row">
        <label for="port" data-i18n="portLabel"></label>
        <input id="port" type="number" min="1" max="65535" placeholder="3080" />
        <p class="hint" data-i18n="portHint"></p>
      </div>
      <div class="row">
        <label for="token" data-i18n="tokenLabel"></label>
        <div class="token-row">
          <input id="token" type="password" spellcheck="false" autocomplete="off" />
          <button id="reveal" type="button" aria-pressed="false" data-i18n="tokenShow"></button>
        </div>
        <p class="hint" data-i18n="tokenHint"></p>
        <!-- Announces the shape as soon as there is something to judge, so a
             truncated paste is caught here rather than as a failed connection
             that blames the harness. -->
        <p id="shape" hidden></p>
      </div>
      <div class="row">
        <label class="check" for="autopush" style="font-weight:600">
          <input id="autopush" type="checkbox" style="width:auto;margin:0" />
          <span data-i18n="autoPushLabel"></span>
        </label>
        <p class="hint" data-i18n="autoPushHint"></p>
      </div>
      <div class="actions">
        <button id="save" class="primary" data-i18n="save"></button>
        <button id="test" data-i18n="test"></button>
        <button id="refetch" data-i18n="refetch"></button>
      </div>
      <div id="result" hidden></div>
    </fieldset>

    <fieldset>
      <legend data-i18n="filesTitle"></legend>
      <p style="margin:0" data-i18n="filesBody"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="controlTitle"></legend>
      <ol>
        <li data-i18n="control1"></li>
        <li data-i18n="control2"></li>
        <li data-i18n="control3"></li>
        <li data-i18n="control4"></li>
        <li data-i18n="control5"></li>
      </ol>
    </fieldset>

    <script src="options.js" type="module"></script>
  </body>
</html>
